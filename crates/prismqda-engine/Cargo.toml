[package]
name = "prismqda-engine"
description = "Headless engine for PrismQDA: the project file, its schema, and the event log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
prismqda-stats = { version = "0.1.0", path = "../prismqda-stats" }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
similar = "2.7.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"

[dev-dependencies]
proptest = "1.8.0"
tempfile = "3.27.0"
