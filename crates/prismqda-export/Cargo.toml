[package]
name = "prismqda-export"
description = "Exporters for PrismQDA: the codebook and coded segments as Excel, Word, QDC, and CSV."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
prismqda-engine = { version = "0.1.0", path = "../prismqda-engine" }
prismqda-pdfview = { version = "0.1.0", path = "../prismqda-pdfview" }
prismqda-import = { version = "0.1.0", path = "../prismqda-import" }
quick-xml = "0.41.0"
unicode-normalization = "0.1.26"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
