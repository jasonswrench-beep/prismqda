[package]
name = "prismqda-api"
description = "The command layer between PrismQDA's interface and its engine: JSON in, JSON out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
prismqda-engine = { version = "0.1.0", path = "../prismqda-engine" }
prismqda-pdfview = { version = "0.1.0", path = "../prismqda-pdfview" }
prismqda-import = { version = "0.1.0", path = "../prismqda-import" }
prismqda-export = { version = "0.1.0", path = "../prismqda-export" }
encoding_rs = "0.8.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
rusqlite = "0.40.2"
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
