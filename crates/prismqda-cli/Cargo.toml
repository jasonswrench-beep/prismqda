[package]
name = "prismqda-cli"
description = "Command-line harness for the PrismQDA engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "prismqda"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.61", features = ["derive", "env"] }
prismqda-api = { version = "0.1.0", path = "../prismqda-api" }
prismqda-engine = { version = "0.1.0", path = "../prismqda-engine" }
prismqda-import = { version = "0.1.0", path = "../prismqda-import" }
serde_json = { version = "1.0.154", optional = true }
sha2 = "0.10.9"
tiny_http = { version = "0.12.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# A local-only HTTP bridge so the interface can be tested in a headless browser against the real engine.
dev-server = ["dep:tiny_http", "dep:serde_json"]
